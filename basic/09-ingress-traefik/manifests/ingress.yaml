apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami-ingress
spec:
  ingressClassName: # TODO: MicroK8s' Traefik addon exposes "public" (default), "traefik", and "nginx" IngressClasses — pick one, e.g. public
  rules:
    - host: # TODO: a local domain, e.g. whoami.microk8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
