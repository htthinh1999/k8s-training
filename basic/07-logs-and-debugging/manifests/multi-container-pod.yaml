apiVersion: v1
kind: Pod
metadata:
  name: multi-log-pod
spec:
  containers:
    - name: # TODO: name the first container, e.g. app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          i=0
          while true; do
            i=$((i+1))
            echo "app tick $i at $(date)"
            sleep 2
          done
    - name: # TODO: name the second container, e.g. sidecar
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          i=0
          while true; do
            i=$((i+1))
            echo "sidecar heartbeat $i"
            sleep 5
          done
