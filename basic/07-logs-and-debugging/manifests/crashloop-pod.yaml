apiVersion: v1
kind: Pod
metadata:
  name: crashloop-pod
spec:
  restartPolicy: Always
  containers:
    - name: flaky
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - "echo 'starting up...'; sleep # TODO: a short number of seconds, e.g. 5 ; echo 'simulating a crash'; exit 1"
