apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: # TODO: set an initial replica count, e.g. 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: # TODO: set the image, e.g. nginx:1.27-alpine
          ports:
            - containerPort: 80
