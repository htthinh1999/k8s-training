apiVersion: v1
kind: Service
metadata:
  name: whoami-loadbalancer
spec:
  type: # TODO: set the Service type, e.g. LoadBalancer
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
  # Optional: uncomment to request a specific IP from the MetalLB pool
  # instead of letting MetalLB pick one automatically.
  # loadBalancerIP: 192.168.1.240
