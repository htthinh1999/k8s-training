apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - # TODO: reference the base, e.g. ../../base

namePrefix: # TODO: e.g. dev-

configMapGenerator:
  - name: app-env-config       # must match the generator name in base/kustomization.yaml to merge
    behavior: merge
    literals:
      - ENVIRONMENT= # TODO: e.g. development

patches:
  - target:
      kind: Deployment
      name: nginx
    patch: |-
      - op: replace
        path: /spec/replicas
        value: # TODO: replica count for dev, e.g. 1
