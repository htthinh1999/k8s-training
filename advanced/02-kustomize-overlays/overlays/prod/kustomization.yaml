apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - # TODO: reference the base, e.g. ../../base

namePrefix: # TODO: e.g. prod-

configMapGenerator:
  - name: app-env-config
    behavior: merge
    literals:
      - ENVIRONMENT= # TODO: e.g. production

patches:
  - target:
      kind: Deployment
      name: nginx
    patch: |-
      - op: replace
        path: /spec/replicas
        value: # TODO: replica count for prod, e.g. 3
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
