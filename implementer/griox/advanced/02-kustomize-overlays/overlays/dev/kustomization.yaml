apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-

configMapGenerator:
  - name: app-env-config       # must match the generator name in base/kustomization.yaml to merge
    behavior: merge
    literals:
      - ENVIRONMENT=development

patches:
  - target:
      kind: Deployment
      name: nginx
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
